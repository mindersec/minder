on:
  workflow_call:

jobs:
  security-scan:
    runs-on: ubuntu-latest
    name: Security Scan

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Make results directory
        run: mkdir -p ../results

      - name: Code Security Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scanners: vuln,secret
          trivy-config: .trivy.yml
          exit-code: 0
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          format: sarif
          output: code-results.sarif
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: code-results.sarif
          category: code-scan

      # Re-run with table output so findings are visible in the job log.
      # Reuses the Trivy binary and DB cache from the step above.
      - name: Check for vulnerabilities
        id: code-vuln-check
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: 'fs'
          scanners: vuln,secret
          trivy-config: .trivy.yml
          exit-code: 1
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          format: table
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Helm Security Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        if: always()
        with:
          skip-setup-trivy: true
          scan-type: 'config'
          trivy-config: .trivy.yml
          exit-code: 0
          ignore-unfixed: true
          scan-ref: ./deployment/helm
          format: sarif
          output: helm-results.sarif
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: helm-results.sarif
          category: infra-scan

      - name: Check Helm chart for misconfigurations
        id: helm-config-check
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        if: always()
        with:
          skip-setup-trivy: true
          scan-type: 'config'
          trivy-config: .trivy.yml
          exit-code: 1
          ignore-unfixed: true
          scan-ref: ./deployment/helm
          format: table
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db,public.ecr.aws/aquasecurity/trivy-db
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Link to Code scanning results
        if: failure()
        env:
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            filter="pr%3A${PR_NUMBER}"
          else
            filter="branch%3A${REF_NAME}"
          fi
          url="${SERVER_URL}/${REPOSITORY}/security/code-scanning?query=is%3Aopen+tool%3ATrivy+${filter}"
          msg="Trivy found issues. See the table above, or the Code scanning results: ${url}"
          echo "::error::${msg}"
          echo "${msg}" >> "$GITHUB_STEP_SUMMARY"
