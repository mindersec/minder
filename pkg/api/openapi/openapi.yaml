            properties:
                project:
                    allOf:
                        - $ref: '#/components/schemas/Project'
                    description: project is the project that was updated.
        PatchProviderResponse:
            required:
                - provider
            type: object
            properties:
                provider:
                    $ref: '#/components/schemas/Provider'
        Profile:
            type: object
            properties:
                context:
                    allOf:
                        - $ref: '#/components/schemas/Context'
                    description: context is the context in which the profile is evaluated.
                id:
                    readOnly: true
                    type: string
                    description: |-
                        id is the id of the profile.
                         This is optional and is set by the system.
                name:
                    type: string
                    description: name is the name of the profile instance.
                labels:
                    type: array
                    items:
                        type: string
                    description: |-
                        labels are a set of system-provided attributes which can be used to
                         filter profiles and status results.  Labels cannot be set by the user,
                         but are returned in ListProfiles.

                         Labels use DNS label constraints, with a possible namespace prefix
                         separated by a colon (:).  They are intended to allow filtering, but
                         not to store arbitrary metadata.
                         DNS labels are 1-63 character alphanumeric strings with internal hyphens.
                         An RE2-style validation regex would be:

                         DNS_STR = "[a-zA-Z0-9](?[-a-zA-Z0-9]{0,61}[a-zA-Z0-9])?"
                         ($DNS_STR:)?$DNS_STR
                repository:
                    type: array
                    items:
                        $ref: '#/components/schemas/Profile_Rule'
                    description: These are the entities that one could set in the profile.
                buildEnvironment:
                    type: array
                    items:
                        $ref: '#/components/schemas/Profile_Rule'
                artifact:
                    type: array
                    items:
                        $ref: '#/components/schemas/Profile_Rule'
                pullRequest:
                    type: array
                    items:
                        $ref: '#/components/schemas/Profile_Rule'
                release:
                    type: array
                    items:
                        $ref: '#/components/schemas/Profile_Rule'
                pipelineRun:
                    type: array
                    items:
                        $ref: '#/components/schemas/Profile_Rule'
                taskRun:
                    type: array
                    items:
                        $ref: '#/components/schemas/Profile_Rule'
                build:
                    type: array
                    items:
                        $ref: '#/components/schemas/Profile_Rule'
                selection:
                    type: array
                    items:
                        $ref: '#/components/schemas/Profile_Selector'
                remediate:
                    type: string
                    description: |-
                        whether and how to remediate (on,off,dry_run)
                         this is optional and defaults to "off"
                alert:
                    type: string
                    description: |-
                        whether and how to alert (on,off,dry_run)
                         this is optional and defaults to "on"
                type:
                    type: string
                    description: type is a placeholder for the object type. It should always be set to "profile".
                version:
                    type: string
                    description: version is the version of the profile type. In this case, it is "v1"
                displayName:
                    type: string
                    description: display_name is the display name of the profile.
            description: |-
                Profile defines a profile that is user defined.
                 All fields are optional because we want to allow partial updates.
        ProfileStatus:
            required:
                - profileStatus
            type: object
            properties:
                profileId:
                    type: string
                    description: profile_id is the id of the profile.  One of profile_id or profile_name must be set.
                profileName:
                    type: string
                    description: profile_name is the name of the profile.  One of profile_id or profile_name must be set.
                profileStatus:
                    type: string
                    description: profile_status is the status of the profile
                lastUpdated:
                    type: string
                    description: last_updated is the last time the profile was updated
                    format: date-time
                profileDisplayName:
                    type: string
                    description: profile_display_name is the display name of the profile
            description: get the overall profile status as output
        Profile_Rule:
            type: object
            properties:
                type:
                    type: string
                    description: type is the type of the rule to be instantiated.
                params:
                    type: object
                    description: |-
                        params are the parameters that are passed to the rule.
                         This is optional and depends on the rule type.
                def:
                    type: object
                    description: |-
                        def is the definition of the rule.
                         This depends on the rule type.
                name:
                    type: string
                    description: name is the descriptive name of the rule, not to be confused with type
            description: Rule defines the individual call of a certain rule type.
        Profile_Selector:
            type: object
            properties:
                id:
                    type: string
                    description: id is optional and use for updates to match upserts as well as read operations. It is ignored for creates.
                entity:
                    type: string
                    description: entity is the entity to select.
                selector:
                    type: string
                    description: expr is the expression to select the entity.
                description:
                    type: string
                    description: description is the human-readable description of the selector.
        Project:
            required:
                - projectId
                - name
                - createdAt
                - updatedAt
            type: object
            properties:
                projectId:
                    type: string
                name:
                    type: string
                description:
                    type: string
                    description: |-
                        description is a human-readable description of the project.
                         This is optional.
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                displayName:
                    type: string
                    description: |-
                        display_name allows for a human-readable name to be used.
                         display_names are short *non-unique* strings to provide
                         a user-friendly name for presentation in lists, etc.
                         This is optional.
            description: Project API Objects. This is only used in responses.
        ProjectPatch:
            type: object
            properties:
                displayName:
                    type: string
                    description: display_name is the display name of the project to update.
                description:
                    type: string
                    description: description is the description of the project to update.
        ProjectRole:
            required:
                - role
                - project
            type: object
            properties:
                role:
                    $ref: '#/components/schemas/Role'
                project:
                    $ref: '#/components/schemas/Project'
            description: ProjectRole has the project along with the role the user has in the project
        Provider:
            type: object
            properties:
                name:
                    type: string
                    description: name is the name of the provider.
                class:
                    type: string
                    description: class is the name of the provider implementation, eg. 'github' or 'gh-app'.
                project:
                    readOnly: true
                    type: string
                    description: |-
                        project is the project where the provider is.  This is ignored on input
                         in favor of the context field in CreateProviderRequest.
                version:
                    type: string
                    description: |-
                        version is the version of the provider.
                         if unset, "v1" is assumed.
                implements:
                    type: array
                    items:
                        type: integer
                        format: enum
                    description: implements is the list of interfaces that the provider implements.
                config:
                    type: object
                    description: config is the configuration of the provider.
                authFlows:
                    type: array
                    items:
                        type: integer
                        format: enum
                    description: auth_flows is the list of authorization flows that the provider supports.
                parameters:
                    allOf:
                        - $ref: '#/components/schemas/ProviderParameter'
                    description: parameters is the list of parameters that the provider requires.
                credentialsState:
                    readOnly: true
                    type: string
                    description: |-
                        credentials_state is the state of the credentials for the provider.
                         This is an output-only field. It may be: "set", "unset", "not_applicable".
                id:
                    type: string
                    description: id is the unique identifier of the provider.
            description: |-
                Provider represents a provider that is used to interact with external systems.
                 All fields are optional because we want to allow partial updates.
        ProviderClassInfo:
            required:
                - class
                - displayName
                - supportedProviderTypes
                - supportedAuthFlows
            type: object
            properties:
                class:
                    type: string
                    description: class is the provider class identifier.
                displayName:
                    type: string
                    description: display_name is a human-friendly provider class name.
                description:
                    type: string
                    description: description is a short plaintext summary of the provider class.
                supportedProviderTypes:
                    type: array
                    items:
                        type: integer
                        format: enum
                    description: supported_provider_types is the list of provider traits/interfaces supported by this class.
                supportedAuthFlows:
                    type: array
                    items:
                        type: integer
                        format: enum
                    description: supported_auth_flows is the list of supported authorization flows.
                supportedEntities:
                    type: array
                    items:
                        type: integer
                        format: enum
                    description: supported_entities is the list of entity types supported by this provider class.
                documentationUrl:
                    type: string
                    description: documentation_url points to provider-specific or generic documentation.
        ProviderParameter:
            type: object
            properties:
                githubApp:
                    $ref: '#/components/schemas/GitHubAppParams'
        PullRequestRemediation_ActionsReplaceTagsWithSha:
            type: object
            properties:
                exclude:
                    type: array
                    items:
                        type: string
                    description: List of actions to exclude from the replacement
        PullRequestRemediation_Content:
            type: object
            properties:
                path:
                    type: string
                    description: the file to patch
                action:
                    type: string
                    description: how to patch the file. For now, only replace is supported
                content:
                    type: string
                    description: the content of the file
                mode:
                    type: string
                    description: |-
                        the GIT mode of the file. Not UNIX mode! String because the GH API also uses strings
                         the usual modes are: 100644 for regular files, 100755 for executable files and
                         040000 for submodules (which we don't use but now you know the meaning of the 1 in 100644)
                         see e.g. https://github.com/go-git/go-git/blob/32e0172851c35ae2fac495069c923330040903d2/plumbing/filemode/filemode.go#L16
        ReconcileEntityRegistrationRequest:
            required:
                - entity
            type: object
            properties:
                context:
                    $ref: '#/components/schemas/Context'
                entity:
                    type: string
                    description: entity is the entity type
        ReconcileEntityRegistrationResponse:
            type: object
            properties: {}
        RegisterEntityRequest:
            required:
                - entityType
                - identifyingProperties
            type: object
            properties:
                context:
                    allOf:
                        - $ref: '#/components/schemas/ContextV2'
                    description: context is the context in which the entity is created
                entityType:
                    type: integer
                    description: entity_type is the type of entity to create
                    format: enum
                identifyingProperties:
                    type: object
                    additionalProperties:
                        $ref: '#/components/schemas/GoogleProtobufValue'
                    description: |-
                        identifying_properties uniquely identifies the entity in the provider.
                         For example, for a GitHub repository use github/repo_owner and github/repo_name,
                         or use upstream_id to identify by provider's internal ID.
                         Each key maps to a value that can be a string, number, boolean, or nested structure.
            description: RegisterEntityRequest is the request message for the RegisterEntity method
        RegisterEntityResponse:
            required:
                - entity
            type: object
            properties:
                entity:
                    allOf:
                        - $ref: '#/components/schemas/EntityInstance'
                    description: entity is the entity that was created
            description: RegisterEntityResponse is the response message for the RegisterEntity method
        RegisterRepoResult:
            required:
                - status
            type: object
            properties:
                repository:
                    $ref: '#/components/schemas/Repository'
                status:
                    $ref: '#/components/schemas/RegisterRepoResult_Status'
        RegisterRepoResult_Status:
            type: object
            properties:
                success:
                    type: boolean
                error:
                    type: string
        RegisterRepositoryRequest:
            type: object
            properties:
                provider:
                    type: string
                repository:
                    allOf:
                        - $ref: '#/components/schemas/UpstreamRepositoryRef'
                    description: |-
                        repository is the repository to register. This is optional if entity
                         is set.
                context:
                    $ref: '#/components/schemas/Context'
                entity:
                    allOf:
                        - $ref: '#/components/schemas/UpstreamEntityRef'
                    description: |-
                        entity is the entity to register. This is the same as the repository
                         field, but uses the new UpstreamEntityRef message. This is what we'll
                         migrate to eventually. This is optional if repository is set.
        RegisterRepositoryResponse:
            required:
                - result
            type: object
            properties:
                result:
                    $ref: '#/components/schemas/RegisterRepoResult'
        RegistrableUpstreamEntityRef:
            required:
                - entity
            type: object
            properties:
                entity:
                    $ref: '#/components/schemas/UpstreamEntityRef'
                registered:
                    type: boolean
                    description: True if the entity is already registered in Minder.
        Remediate_GhBranchProtectionType:
            type: object
            properties:
                patch:
                    type: string
        Remediate_IssueRemediation:
            type: object
            properties:
                title:
                    type: string
                    description: |-
                        the title of the issue
                         Supports Minder's template interpolation syntax.
                         This is not validated here as it will be validated by the repository provider, i.e. GitHub upon
                         creation of the issue
                body:
                    type: string
                    description: |-
                        the body of the issue
                         Supports Minder's template interpolation syntax
                         The rendered body is interpreted as Markdown by repository providers that
                         support Markdown (e.g. Github)
                         This is not validated here as it will be validated by the repository provider, i.e. GitHub upon
                         creation of the issue
                labels:
                    type: array
                    items:
                        type: string
                    description: |-
                        Labels to apply when creating the issue.
                         This is not validated here as it will be validated by the repository provider, i.e. GitHub upon
                         creation of the issue
                assignees:
                    type: array
                    items:
                        type: string
                    description: |-
                        Usernames to assign when creating the issue.
                         This is not validated here as it will be validated by the repository provider, i.e. GitHub upon
                         creation of the issue
        Remediate_PullRequestRemediation:
            type: object
            properties:
                title:
                    type: string
                    description: |-
                        the title of the PR
                         This is not validated here as it will be validated by the repository provider, i.e. GitHub upon
                         creation of the PR.
                body:
                    type: string
                    description: |-
                        the body of the PR
                         This is not validated here as it will be validated by the repository provider, i.e. GitHub upon
                         creation of the PR.
                contents:
                    type: array
                    items:
                        $ref: '#/components/schemas/PullRequestRemediation_Content'
                method:
                    type: string
                    description: |-
                        the method to use to create the PR. For now, these are supported:
                         -- minder.content - ensures that the content of the file is exactly as specified
                                             refer to the Content message for more details
                         -- minder.actions.replace_tags_with_sha - finds any github actions within a workflow
                                                                   file and replaces the tag with the SHA
                         -- minder.yq.evaluate - evaluates a yq expression on a file
                params:
                    type: object
                    description: |-
                        params are unstructured parameters passed to the method. These are optional
                         and evaluated by the method.
                actionsReplaceTagsWithSha:
                    allOf:
                        - $ref: '#/components/schemas/PullRequestRemediation_ActionsReplaceTagsWithSha'
                    description: |-
                        If the method is minder.actions.replace_tags_with_sha, this is the configuration
                         for that method
            description: the name stutters a bit but we already use a PullRequest message for handling PR entities
        RemoveRoleResponse:
            type: object
            properties:
                roleAssignment:
                    allOf:
                        - $ref: '#/components/schemas/RoleAssignment'
                    description: role_assignment is the role assignment that was removed.
                invitation:
                    allOf:
                        - $ref: '#/components/schemas/Invitation'
                    description: invitation contains the details of the invitation that was removed.
        Repository:
            required:
                - id
                - owner
                - name
                - isPrivate
                - isFork
            type: object
            properties:
                id:
                    type: string
                    description: |-
                        id is the unique identifier of the repository within Minder.
                         It is always populated, but the optional keyword is used for
                         backwards compatibility.
                context:
                    $ref: '#/components/schemas/Context'
                owner:
                    type: string
                name:
                    type: string
                repoId:
                    type: string
                hookId:
                    type: string
                hookUrl:
                    type: string
                deployUrl:
                    type: string
                cloneUrl:
                    type: string
                hookName:
                    type: string
                hookType:
                    type: string
                hookUuid:
                    type: string
                isPrivate:
                    type: boolean
                isFork:
                    type: boolean
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
                defaultBranch:
                    type: string
                license:
                    type: string
                properties:
                    type: object
                    description: properties is a map of properties of the entity.
            description: Repository API objects. This is only used in responses.
        ResolveInvitationResponse:
            required:
                - role
                - project
                - isAccepted
            type: object
            properties:
                role:
                    type: string
                    description: |-
                        role is the role that would be assigned if the user
                         accepts the invitation.
                email:
                    type: string
                    description: email is the email address of the invited user.
                project:
                    type: string
                    description: project is the project to which the user is invited.
                isAccepted:
                    type: boolean
                    description: is_accepted is the status of the invitation.
                projectDisplay:
                    type: string
                    description: |-
                        project_display is the display name of the project to which the user
                         is invited.
        RestDataSource:
            type: object
            properties:
                def:
                    type: object
                    additionalProperties:
                        $ref: '#/components/schemas/RestDataSource_Def'
                    description: defs is the list of definitions for the REST API.
                providerAuth:
                    type: boolean
                    description: |-
                        provider_auth enables provider authentication for this data source.
                         When enabled, the data source will use the provider's authentication
                         credentials to make requests.
            description: RestDataSource is the REST data source driver.
        RestDataSource_Def:
            required:
                - endpoint
            type: object
            properties:
                endpoint:
                    type: string
                    description: |-
                        endpoint is the URL of the REST API. Note that endpoints are
                         templates that can be parameterized with variables. Parametrization
                         is done using RFC 6570.
                method:
                    type: string
                    description: |-
                        method is the HTTP method to use for the request.
                         If left unset, it will default to "GET".
                headers:
                    type: object
                    additionalProperties:
                        type: string
                    description: headers is a map of headers to send with the request.
                bodyobj:
                    type: object
                    description: body is the body of the request.
                bodystr:
                    type: string
                    description: bodystr is the body of the request as a string.
                bodyFromField:
                    type: string
                    description: |-
                        body_from_field is the field in the input to use as the body.
                         If the value is an string, it will be used as the body, as is.
                         If the value is an object, it will be serialized as JSON.
                         If the value is not found in the input, the request will fail.
                parse:
                    type: string
                    description: |-
                        parse is the parse configuration for the response.
                         This allows us to serialize the response into a structured format,
                         or not.
                         If left unset, the response will be treated as a string.
                         If set to "json", the response will be parsed as JSON.
                fallback:
                    type: array
                    items:
                        $ref: '#/components/schemas/Def_Fallback'
                    description: |-
                        fallback is the fallback configuration for the response in case
                         of an unexpected status code.
                expectedStatus:
                    type: array
                    items:
                        type: integer
                        format: int32
                    description: |-
                        expected_status is the expected status code for the response.
                         This may be repeated to allow for multiple expected status codes.
                         If left unset, it will default to 200.
                inputSchema:
                    type: object
                    description: input_schema is the schema for the input to the REST API.
        RestType:
            required:
                - endpoint
            type: object
            properties:
                endpoint:
                    type: string
                    description: |-
                        endpoint is the endpoint to fetch data from.
                         This can be a URL or path on the API.
                         This is a required field and must be set.
                         This is also evaluated via a template which allows
                         us dynamically fill in the values.
                method:
                    type: string
                    description: |-
                        method is the method to use to fetch data.
                         Go templates may be used to vary the method using the same parameters
                         as the endpoint.
                headers:
                    type: array
                    items:
                        type: string
                    description: headers are the headers to be sent to the endpoint.
                body:
                    type: string
                    description: |-
                        body is the body to be sent to the endpoint, which must be valid JSON
                         Go templates may be used to vary the method using the same parameters
                         as the endpoint.
                parse:
                    type: string
                    description: parse is the parsing mechanism to be used to parse the data.
                fallback:
                    type: array
                    items:
                        $ref: '#/components/schemas/RestType_Fallback'
                    description: |-
                        fallback provides a body that the ingester would return in case
                         the REST call returns a non-200 status code.
            description: |-
                RestType defines the rest data evaluation.
                 This is used to fetch data from a REST endpoint.
        RestType_Fallback:
            type: object
            properties:
                httpCode:
                    type: integer
                    format: int32
                body:
                    type: string
                    description: This is expected to be a valid JSON string.
        Role:
            required:
                - name
                - displayName
                - description
            type: object
            properties:
                name:
                    type: string
                    description: name is the name of the role.
                displayName:
                    type: string
                    description: display name of the role
                description:
                    type: string
                    description: description is the description of the role.
        RoleAssignment:
            required:
                - role
            type: object
            properties:
                role:
                    type: string
                    description: role is the role that is assigned.
                subject:
                    type: string
                    description: |-
                        subject is the subject to which the role is assigned.
                         Can be either a UUID or a providername/subject string.
                displayName:
                    type: string
                    description: display_name is the display name of the subject.
                project:
                    type: string
                    description: project is the project in which the role is assigned.
                email:
                    type: string
                    description: email is the email address of the subject used for invitations.
                firstName:
                    type: string
                    description: first_name is the first name of the subject.
                lastName:
                    type: string
                    description: last_name is the last name of the subject.
        RuleEvaluationStatus:
            required:
                - ruleId
                - entity
                - status
                - ruleTypeName
                - releasePhase
            type: object
            properties:
                profileId:
                    type: string
                    description: profile_id is the id of the profile
                ruleId:
                    type: string
                    description: rule_id is the id of the rule
                ruleName:
                    type: string
                    description: rule_name is the type of the rule. Deprecated in favor of rule_type_name
                entity:
                    type: string
                    description: entity is the entity that was evaluated
                status:
                    type: string
                    description: status is the status of the evaluation
                lastUpdated:
                    type: string
                    description: last_updated is the last time the profile was updated
                    format: date-time
                entityInfo:
                    type: object
                    additionalProperties:
                        type: string
                    description: entity_info is the information about the entity
                details:
                    type: string
                    description: details is the description of the evaluation if any
                guidance:
                    type: string
                    description: guidance is the guidance for the evaluation if any
                remediationStatus:
                    type: string
                    description: remediation_status is the status of the remediation
                remediationLastUpdated:
                    type: string
                    description: remediation_last_updated is the last time the remediation was performed or attempted
                    format: date-time
                remediationDetails:
                    type: string
                    description: remediation_details is the description of the remediation attempt if any
                ruleTypeName:
                    type: string
                    description: rule_type_name is the name of the rule
                ruleDescriptionName:
                    type: string
                    description: rule_description_name is the name to describe the rule
                alert:
                    allOf:
                        - $ref: '#/components/schemas/EvalResultAlert'
                    description: alert holds the alert details if the rule generated an alert in an external system
                severity:
                    allOf:
                        - $ref: '#/components/schemas/Severity'
                    description: severity is the severity of the rule. This may be empty.
                ruleEvaluationId:
                    type: string
                    description: rule_evaluation_id is the id of the rule evaluation
                remediationUrl:
                    type: string
                    description: remediation_url is a url to get more data about a remediation, for PRs is the link to the PR
                ruleDisplayName:
                    type: string
                    description: rule_display_name captures the display name of the rule
                releasePhase:
                    type: integer
                    description: release_phase is the phase of the release
                    format: enum
                output:
                    allOf:
                        - $ref: '#/components/schemas/GoogleProtobufValue'
                    description: |-
                        output optionally contains the structured rule evaluation output.
                         Because output may be multiple KB, it is only returned
                         if include_outputs is set. Historical evaluations may
                         discard structured output sooner than status results.
            description: get the status of the rules for a given profile
        RuleType:
            required:
                - name
                - def
                - description
                - guidance
            type: object
            properties:
                version:
                    type: string
                    description: version is the version of the rule type API.
                type:
                    type: string
                    description: type is the type of the rule.
                id:
                    readOnly: true
                    type: string
                    description: |-
                        id is the id of the rule type.
                         This is mostly optional and is set by the server.
                name:
                    type: string
                    description: name is the name of the rule type.
                displayName:
                    type: string
                    description: display_name is the display name of the rule type.
                shortFailureMessage:
                    type: string
                    description: short_failure_message is the message to display when the evaluation fails.
                context:
                    allOf:
                        - $ref: '#/components/schemas/Context'
                    description: context is the context in which the rule is evaluated.
                def:
                    allOf:
                        - $ref: '#/components/schemas/RuleType_Definition'
                    description: def is the definition of the rule type.
                description:
                    type: string
                    description: |-
                        description is the description of the rule type.
                         This is expected to be a valid markdown formatted string.
                guidance:
                    type: string
                    description: |-
                        guidance are instructions we give the user in case a rule fails.
                         This is expected to be a valid markdown formatted string.
                severity:
                    allOf:
                        - $ref: '#/components/schemas/Severity'
                    description: severity is the severity of the rule type.
                releasePhase:
                    type: integer
                    description: release_phase is the release phase of the rule type, i.e. alpha, beta, ga, deprecated.
                    format: enum
            description: |-
                RuleType defines rules that may or may not be user defined.
                 The version is assumed from the folder's version.
        RuleType_Definition:
            required:
                - ingest
                - eval
            type: object
            properties:
                inEntity:
                    type: string
                    description: |-
                        in_entity is the entity in which the rule is evaluated.
                         This can be repository, build_environment or artifact.
                providerTraits:
                    type: array
                    items:
                        type: string
                    description: |-
                        provider_traits declares the provider trait(s) this rule type
                         requires an implementation of. Values are trait names as used in
                         provider class definitions, e.g. "github", "gitlab", "rest",
                         "git", "oci", "repo-lister", "image-lister".
                         This is AND semantics: a rule type requires an implementation of
                         every listed trait, not just one of them. For example, a rule
                         type requiring ["git", "github"] needs a provider that
                         implements both traits (e.g. to read repo contents via git and
                         call a forge-specific API via github). Use ["rest", "github"] for
                         a rule that calls the GitHub API and ["rest", "gitlab"] for one
                         that calls the GitLab API. If empty, the rule type is not gated
                         by provider traits.
                ruleSchema:
                    type: object
                    description: rule_schema is the schema of the rule. This is expressed in JSON Schema.
                paramSchema:
                    type: object
                    description: |-
                        param_schema is the schema of the parameters that are passed to the rule.
                         This is expressed in JSON Schema.
                ingest:
                    $ref: '#/components/schemas/Definition_Ingest'
                eval:
                    $ref: '#/components/schemas/Definition_Eval'
                remediate:
                    $ref: '#/components/schemas/Definition_Remediate'
                alert:
                    $ref: '#/components/schemas/Definition_Alert'
            description: Definition defines the rule type. It encompases the schema and the data evaluation.
        Severity:
            type: object
            properties:
                value:
                    type: integer
                    description: value is the severity value.
                    format: enum
            description: Severity defines the severity of the rule.
        Status:
            type: object
            properties:
                code:
                    type: integer
                    description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
                    format: int32
                message:
                    type: string
                    description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
                details:
                    type: array
                    items:
                        $ref: '#/components/schemas/GoogleProtobufAny'
                    description: A list of messages that carry the error details.  There is a common set of message types for APIs to use.
            description: 'The `Status` type defines a logical error model that is suitable for different programming environments, including REST APIs and RPC APIs. It is used by [gRPC](https://github.com/grpc). Each `Status` message contains three pieces of data: error code, error message, and error details. You can find out more about this error model and how to work with it in the [API Design Guide](https://cloud.google.com/apis/design/errors).'
        StoreProviderTokenRequest:
            required:
                - accessToken
            type: object
            properties:
                provider:
                    type: string
                accessToken:
                    type: string
                    description: access_token is the token to store.
                owner:
                    type: string
                    description: |-
                        owner is the owner (e.g GitHub org) that the provider is associated with.
                         This is optional, but an empty string is allowed as existing clients may
                         set the field unconditionally.
                context:
                    $ref: '#/components/schemas/Context'
        StoreProviderTokenResponse:
            type: object
            properties: {}
        StructDataSource:
            type: object
            properties:
                def:
                    type: object
                    additionalProperties:
                        $ref: '#/components/schemas/StructDataSource_Def'
                    description: defs is the list of definitions for the structured data API.
            description: StructDataSource is the structured data source driver.
        StructDataSource_Def:
            required:
                - path
            type: object
            properties:
                path:
                    allOf:
                        - $ref: '#/components/schemas/Def_Path'
                    description: Path is the path specification for the structured data source.
        UpdateDataSourceRequest:
            type: object
            properties:
                dataSource:
                    $ref: '#/components/schemas/DataSource'
        UpdateDataSourceResponse:
            type: object
            properties:
                dataSource:
                    $ref: '#/components/schemas/DataSource'
        UpdateProfileRequest:
            required:
                - profile
            type: object
            properties:
                profile:
                    $ref: '#/components/schemas/Profile'
        UpdateProfileResponse:
            required:
                - profile
            type: object
            properties:
                profile:
                    $ref: '#/components/schemas/Profile'
        UpdateProjectRequest:
            type: object
            properties:
                context:
                    allOf:
                        - $ref: '#/components/schemas/Context'
                    description: context is the context in which the project is updated.
                displayName:
                    type: string
                    description: |-
                        display_name is the display name of the project to update.
                         This is optional.
                description:
                    type: string
                    description: |-
                        description is the description of the project to update.
                         This is optional.
        UpdateProjectResponse:
            required:
                - project
            type: object
            properties:
                project:
                    allOf:
                        - $ref: '#/components/schemas/Project'
                    description: project is the project that was updated.
        UpdateRoleRequest:
            required:
                - roles
            type: object
            properties:
                context:
                    allOf:
                        - $ref: '#/components/schemas/Context'
                    description: context is the context in which the role assignment is evaluated.
                subject:
                    type: string
                    description: |-
                        subject is the account to change permissions for.
                         The account must already have permissions on the project
                roles:
                    type: array
                    items:
                        type: string
                    description: |-
                        All subject roles are _replaced_ with the following role assignments.  Must be non-empty,
                         use RemoveRole to remove permissions entirely from the project.
                email:
                    type: string
                    description: email is the email address of the subject used for updating invitations
        UpdateRoleResponse:
            type: object
            properties:
                roleAssignments:
                    type: array
                    items:
                        $ref: '#/components/schemas/RoleAssignment'
                    description: role_assignments are the role assignments that were updated.
                invitations:
                    type: array
                    items:
                        $ref: '#/components/schemas/Invitation'
                    description: invitations contains the details of the invitations that were updated.
        UpdateRuleTypeRequest:
            required:
                - ruleType
            type: object
            properties:
                ruleType:
                    allOf:
                        - $ref: '#/components/schemas/RuleType'
                    description: rule_type is the rule type to be updated.
            description: UpdateRuleTypeRequest is the request to update a rule type.
        UpdateRuleTypeResponse:
            required:
                - ruleType
            type: object
            properties:
                ruleType:
                    allOf:
                        - $ref: '#/components/schemas/RuleType'
                    description: rule_type is the rule type that was updated.
                warnings:
                    type: array
                    items:
                        type: string
                    description: warnings contains non-fatal notices about the updated rule type.
            description: UpdateRuleTypeResponse is the response to update a rule type.
        UpstreamEntityRef:
            type: object
            properties:
                context:
                    allOf:
                        - $ref: '#/components/schemas/ContextV2'
                    description: |-
                        context is the context in which the entity is evaluated.
                         Note that the context is included here since users of
                         this message may return upstream references from
                         multiple providers
                type:
                    type: integer
                    description: type is the type of the entity.
                    format: enum
                properties:
                    type: object
                    description: |-
                        properties is a map of properties of the entity.
                         This will be used to identify the entity in the upstream system
                         and will be a subset of the properties of the entity that will
                         be stored in Minder.
            description: |-
                UpstreamEntityRef providers enough information for the
                 provider to identify the entity in the upstream system.
        UpstreamRepositoryRef:
            required:
                - name
            type: object
            properties:
                owner:
                    type: string
                    description: |-
                        owner is the owner (e.g GitHub org) that the provider is associated with.
                         This is optional.
                name:
                    type: string
                repoId:
                    readOnly: true
                    type: string
                    description: |-
                        The upstream identity of the repository, as an integer.
                         This is only set on output, and is ignored on input.
                context:
                    $ref: '#/components/schemas/Context'
                registered:
                    readOnly: true
                    type: boolean
                    description: |-
                        True if the repository is already registered in Minder.
                         This is only set on output, and is ignored on input.
        UserRecord:
            required:
                - id
                - identitySubject
                - createdAt
                - updatedAt
            type: object
            properties:
                id:
                    type: integer
                    format: int32
                identitySubject:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                updatedAt:
                    type: string
                    format: date-time
            description: user record to be returned
        VerifyProviderCredentialResponse:
            required:
                - created
            type: object
            properties:
                created:
                    type: boolean
                    description: created is true if the provider was created.
                providerName:
                    type: string
                    description: |-
                        provider_name is the name of the provider that was created.
                         This is populated if creation was successful.
            description: |-
                VerifyProviderCredentialRequest responds with a boolean indicating if the provider has been created and the provider
                 name, if it has been created
        VerifyProviderTokenFromResponse:
            required:
                - status
            type: object
            properties:
                status:
                    type: string
tags:
    - name: ArtifactService
    - name: DataSourceService
    - name: EntityInstanceService
      description: EntityInstanceService provides API endpoints for managing entity instances
    - name: EvalResultsService
    - name: HealthService
      description: |-
        Simple Health Check Service
         replies with OK
    - name: InviteService
    - name: OAuthService
    - name: PermissionsService
    - name: ProfileService
    - name: ProjectsService
    - name: ProvidersService
    - name: RepositoryService
    - name: RuleTypeService
    - name: UserService
      description: manage Users CRUD
