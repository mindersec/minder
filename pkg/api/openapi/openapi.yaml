                    format: enum
                id:
                    type: string
                    description: id is the ID of the entity to get status for. Incompatible with `all`
                name:
                    type: string
                    description: name is the name of the entity.  This name is unique within a given project, type, and provider, but may not be globally unique.
            description: |-
                EntityTypedId is a message that carries an ID together with a type to uniquely identify an entity
                 such as (repo, 1), (artifact, 2), ...
        EvalResultAlert:
            type: object
            properties:
                status:
                    type: string
                    description: status is the status of the alert
                lastUpdated:
                    type: string
                    description: last_updated is the last time the alert was performed or attempted
                    format: date-time
                details:
                    type: string
                    description: details is the description of the alert attempt if any
                url:
                    type: string
                    description: url is the URL to the alert
            description: EvalResultAlert holds the alert details for a given rule evaluation
        Eval_Homoglyphs:
            type: object
