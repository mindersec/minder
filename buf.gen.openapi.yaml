# Separate template for OpenAPI v3 generation via protoc-gen-openapi (google/gnostic).
# Run against proto/ only to avoid duplicate output from internal/proto.
# See buf.gen.yaml for the main code generation template.

version: v1
plugins:
  - name: openapi
    out: pkg/api/openapi
    opt:
      - version=v3
